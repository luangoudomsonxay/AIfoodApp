<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ແຊບລາວ – ເມນູອາຫານລາວ ແລະ ລາຄາ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* ຟອນ ເພັດສະຫຼາດ OT: ໃຊ້ຟອນທີ່ຕິດຕັ້ງໃນເຄື່ອງ ຫຼື ວາງໄຟລ໌ Phetsarath_OT.ttf ໄວ້ໂຟນເດີດຽວກັນ */
@font-face{font-family:'Phetsarath OT';src:local('Phetsarath OT'),local('Phetsarath_OT'),local('Phetsarath'),url('Phetsarath_OT.ttf') format('truetype');font-display:swap}
:root{--red:#C8102E;--deep:#8E0B20;--yellow:#FFC72C;--blue:#1B3F94;--green:#2E8B57;--orange:#F26B21;--pink:#E8467C;--ink:#2B1A14;--bg:#FFF6DE;--card:#FFFFFF;--muted:#7A5B4E;--f:'Phetsarath OT','Noto Sans Lao','Saysettha OT',sans-serif}
@media(prefers-color-scheme:dark){:root{--ink:#FFF1D6;--bg:#2A0E12;--card:#3D1A1F;--muted:#D9B9A6}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;font-family:var(--f)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);max-width:520px;margin:0 auto;padding-bottom:84px;line-height:1.6}
header{background:linear-gradient(135deg,var(--red) 0%,var(--deep) 100%);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 56px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:var(--yellow);opacity:.9}
header::before{content:"";position:absolute;right:50px;bottom:-40px;width:90px;height:90px;border-radius:50%;background:var(--blue);opacity:.85}
header h1{font-size:32px;font-weight:700;position:relative;z-index:1}
header p{position:relative;z-index:1;opacity:.95;max-width:70%}
.search{margin:-28px 16px 0;position:relative;z-index:2}
.search input{width:100%;border:0;border-radius:18px;padding:14px 18px;font-size:16px;background:var(--card);color:var(--ink);box-shadow:0 6px 18px rgba(142,11,32,.25)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px;scrollbar-width:none}
.chip{flex:none;border:0;border-radius:99px;padding:8px 16px;font-size:15px;font-weight:700;color:#fff;background:var(--c);opacity:.55}
.chip.on{opacity:1;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.list{display:grid;gap:14px;padding:0 16px}
.dish{background:var(--card);border-radius:22px;overflow:hidden;display:flex;box-shadow:0 4px 14px rgba(0,0,0,.1);border-left:8px solid var(--c)}
.pic{width:112px;min-height:112px;flex:none;display:grid;place-items:center;font-size:48px;background:var(--c);background-size:cover;background-position:center}
.info{padding:12px 14px;flex:1;min-width:0}
.info h3{font-size:18px}
.info p{font-size:14px;margin-top:4px;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.price{background:var(--yellow);color:#5A1A00;font-weight:700;padding:3px 12px;border-radius:99px;font-size:15px}
.fav{border:0;background:none;font-size:26px;line-height:1}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--card);box-shadow:0 -4px 16px rgba(0,0,0,.15);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);border-radius:22px 22px 0 0;z-index:5}
.tab{flex:1;border:0;background:none;color:var(--muted);font-size:14px;padding:6px;border-radius:14px}
.tab span{display:block;font-size:22px}
.tab.on{color:var(--red);background:rgba(255,199,44,.35);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(40,5,10,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.show{display:flex}
.panel{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 20px)}
.hero{height:240px;display:grid;place-items:center;font-size:96px;background:var(--c);background-size:cover;background-position:center;position:relative}
.close{position:absolute;top:12px;right:12px;border:0;background:#fff;border-radius:50%;width:38px;height:38px;font-size:18px}
.body{padding:16px 18px}
.body h2{font-size:26px}
.btn{width:100%;border:0;border-radius:16px;padding:13px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--orange),var(--red));margin-top:12px}
.btn.alt{background:var(--blue)}
.btn:disabled{opacity:.6}
.msg{margin-top:10px;font-size:14px;color:var(--muted);min-height:20px}
.field{display:block;margin:12px 0 4px;font-weight:700}
.field+input{width:100%;padding:13px;border-radius:14px;border:2px solid var(--yellow);font-size:16px;background:var(--card);color:var(--ink)}
.note{background:var(--card);border-radius:16px;padding:14px;margin:12px 16px;font-size:14px;color:var(--muted);border-left:6px solid var(--green)}
</style>
</head>
<body>
<header>
  <h1>ແຊບລາວ 🇱🇦</h1>
  <p>ເມນູອາຫານລາວແນະນຳ ພ້ອມລາຄາໂດຍປະມານ</p>
</header>

<div id="home">
  <div class="search"><input id="q" type="search" placeholder="ຄົ້ນຫາເມນູ ເຊັ່ນ ລາບ ຕຳໝາກຫຸ່ງ"></div>
  <div class="chips" id="chips"></div>
  <div class="list" id="list"></div>
</div>

<div id="settings" hidden>
  <div class="note">ແອັບນີ້ໃຊ້ OpenAI API ເພື່ອສ້າງຮູບອາຫານໃຫ້ງາມ. ໃສ່ API Key ຂອງທ່ານດ້ານລຸ່ມ. ກະແຈ ແລະ ຮູບທັງໝົດເກັບໄວ້ໃນເຄື່ອງນີ້ເທົ່ານັ້ນ (localStorage).</div>
  <div style="padding:0 16px">
    <label class="field" for="key">OpenAI API Key</label>
    <input id="key" type="password" placeholder="sk-..." autocomplete="off">
    <button class="btn" id="saveKey">ບັນທຶກ API Key</button>
    <button class="btn alt" id="clearImgs">ລ້າງຮູບທີ່ສ້າງໄວ້</button>
    <p class="msg" id="setMsg"></p>
  </div>
</div>

<nav>
  <button class="tab on" data-t="home"><span>🍲</span>ເມນູ</button>
  <button class="tab" data-t="fav"><span>❤️</span>ທີ່ມັກ</button>
  <button class="tab" data-t="settings"><span>⚙️</span>ຕັ້ງຄ່າ</button>
</nav>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
const ALL="ທັງໝົດ";
const DISHES=[
{id:1,n:"ຕຳໝາກຫຸ່ງ",cat:"ຕຳ/ລາບ",p:25000,e:"🥗",c:"#2E8B57",d:"ຕຳໝາກຫຸ່ງລົດແຈ່ບ ໃສ່ປາແດກ ກິນກັບເຂົ້າໜຽວ",pr:"papaya salad Lao tam mak hoong in a clay mortar with chili, tomato and long beans"},
{id:2,n:"ລາບ",cat:"ຕຳ/ລາບ",p:35000,e:"🍖",c:"#C8102E",d:"ອາຫານປະຈຳຊາດລາວ ຊີ້ນສັບຄຸກເຂົ້າຄົ້ວ ໝາກນາວ ພິກ ແລະ ຜັກຫອມ",pr:"Lao larb minced meat salad with toasted rice powder, mint and herbs, fresh vegetables on the side"},
{id:3,n:"ເຂົ້າໜຽວ",cat:"ເຂົ້າ/ເສັ້ນ",p:5000,e:"🍚",c:"#F2A900",d:"ເຂົ້າຫຼັກຂອງຄົນລາວ ນຶ່ງຮ້ອນໆ ໃສ່ຕິບເຂົ້າ",pr:"Lao sticky rice in a woven bamboo basket tip khao, steam rising"},
{id:4,n:"ເອາະລາມ",cat:"ແກງ/ຊຸບ",p:45000,e:"🍲",c:"#8E0B20",d:"ແກງແບບຫຼວງພະບາງ ໃສ່ຊີ້ນ ໝາກເຜັດ ແລະ ສະຄ້ານ ລົດເຜັດຊາປາກ",pr:"Luang Prabang or lam stew with buffalo meat, eggplant and sakhan wood in a bowl"},
{id:5,n:"ເຂົ້າປຽກເສັ້ນ",cat:"ເຂົ້າ/ເສັ້ນ",p:25000,e:"🍜",c:"#F26B21",d:"ເສັ້ນໜຽວນຸ່ມໃນນ້ຳຊຸບໄກ່ໃສ ໂຮຍຜັກທຽມເຈຽວ ແລະ ຜັກຊີ",pr:"Lao khao piak sen thick chewy noodle chicken soup with fried garlic and cilantro"},
{id:6,n:"ໄສ້ອົ່ວ",cat:"ປີ້ງ/ທອດ",p:40000,e:"🌭",c:"#E8467C",d:"ໄສ້ກອກສະໝຸນໄພປີ້ງຫອມ ໃສ່ຫົວສີໄຄ ແລະ ໃບຂີ້ຫູດ",pr:"Lao herb sausage sai oua grilled, sliced, with sticky rice and chili dip"},
{id:7,n:"ໝົກປາ",cat:"ແກງ/ຊຸບ",p:35000,e:"🐟",c:"#2E8B57",d:"ປາຫໍ່ໃບຕອງນຶ່ງ ໃສ່ສະໝຸນໄພ ຫອມນຸ່ມ",pr:"Lao steamed fish mok pa in banana leaf parcels opened to show herbs"},
{id:8,n:"ປີ້ງໄກ່",cat:"ປີ້ງ/ທອດ",p:50000,e:"🍗",c:"#F26B21",d:"ໄກ່ບ້ານປີ້ງຖ່ານ ໜັງກອບ ຈ້ຳແຈ່ວບອງ",pr:"Lao charcoal grilled chicken ping kai on skewers with jeow dipping sauce"},
{id:9,n:"ເຝີ",cat:"ເຂົ້າ/ເສັ້ນ",p:30000,e:"🥢",c:"#1B3F94",d:"ເຝີແບບລາວ ນ້ຳຊຸບໃສຫວານກົມກ່ອມ ກິນກັບຜັກສົດຫຼາຍໆ",pr:"Lao feu pho noodle soup with a large plate of fresh herbs, lime and bean sprouts"},
{id:10,n:"ແຈ່ວບອງ",cat:"ນ້ຳພິກ",p:15000,e:"🌶️",c:"#C8102E",d:"ນ້ຳພິກປາແດກ ຂ່າ ສີໄຄ ເຜັດຫອມ ກິນກັບຜັກ ແລະ ແຄບໝູ",pr:"Lao jeow bong chili paste in a bowl with pork rinds and fresh vegetables"},
{id:11,n:"ຊີ້ນແດດ",cat:"ປີ້ງ/ທອດ",p:60000,e:"🥩",c:"#8E0B20",d:"ຊີ້ນງົວຕາກແດດທອດກອບ ຫວານເຄັມ ກິນກັບເຂົ້າໜຽວ",pr:"Lao sun-dried beef sin dad fried crisp, served with sticky rice and jeow"},
{id:12,n:"ກາເຟລາວ",cat:"ຂອງຫວານ/ເຄື່ອງດື່ມ",p:15000,e:"☕",c:"#6B3A1E",d:"ກາເຟຈາກພູພຽງບໍລະເວນ ເຂັ້ມຫອມ ໃສ່ນົມຂົ້ນຫວານ",pr:"Lao iced coffee from Bolaven plateau in a glass with condensed milk"},
{id:13,n:"ເຂົ້າຈີ່ປາເຕ້",cat:"ຂອງຫວານ/ເຄື່ອງດື່ມ",p:20000,e:"🥖",c:"#F2A900",d:"ເຂົ້າຈີ່ແບບລາວ ໃສ່ປາເຕ້ ຜັກດອງ ແລະ ພິກ",pr:"Lao baguette sandwich khao jee pate with pate, pickled vegetables and chili"}
];
const CATS=[ALL,"ຕຳ/ລາບ","ເຂົ້າ/ເສັ້ນ","ແກງ/ຊຸບ","ປີ້ງ/ທອດ","ນ້ຳພິກ","ຂອງຫວານ/ເຄື່ອງດື່ມ"];
const COL=["#C8102E","#F2A900","#2E8B57","#1B3F94","#F26B21","#E8467C","#6B3A1E"];
const $=s=>document.querySelector(s);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
let favs=load("lao_favs",[]),imgs=load("lao_imgs",{}),cat=ALL,tab="home";
const fmt=p=>p.toLocaleString("en-US")+" ກີບ";
const thb=p=>"≈ "+Math.round(p/620)+" ບາດ";
const bg=d=>imgs[d.id]?`style="--c:${d.c};background-image:url(${imgs[d.id]})"`:`style="--c:${d.c}"`;

function render(){
  $("#chips").innerHTML=CATS.map((c,i)=>`<button class="chip ${c===cat?'on':''}" style="--c:${COL[i]}" data-c="${c}">${c}</button>`).join("");
  const q=$("#q").value.trim();
  let L=DISHES.filter(d=>(cat===ALL||d.cat===cat)&&(!q||(d.n+d.d).includes(q)));
  if(tab==="fav")L=L.filter(d=>favs.includes(d.id));
  $("#list").innerHTML=L.length?L.map(d=>`<div class="dish" style="--c:${d.c}" data-id="${d.id}">
    <div class="pic" ${bg(d)}>${imgs[d.id]?"":d.e}</div>
    <div class="info"><h3>${d.n}</h3><p>${d.d}</p>
    <div class="row"><span class="price">${fmt(d.p)}</span><button class="fav" data-f="${d.id}" aria-label="ມັກ">${favs.includes(d.id)?"❤️":"🤍"}</button></div></div></div>`).join(""):
    `<div class="empty">${tab==="fav"?"ຍັງບໍ່ມີເມນູທີ່ມັກ ແຕະ 🤍 ເພື່ອເກັບໄວ້":"ບໍ່ພົບເມນູທີ່ຄົ້ນຫາ"}</div>`;
}
function setTab(t){
  tab=t;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  $("#home").hidden=t==="settings";$("#settings").hidden=t!=="settings";
  if(t!=="settings")render();
}
document.querySelector("nav").onclick=e=>{const b=e.target.closest(".tab");if(b)setTab(b.dataset.t)};
$("#q").oninput=render;
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.c;render()}};
$("#list").onclick=e=>{
  const f=e.target.closest("[data-f]");
  if(f){const id=+f.dataset.f;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save("lao_favs",favs);render();return}
  const c=e.target.closest(".dish");if(c)openDish(+c.dataset.id);
};

let cur=null;
function openDish(id){
  cur=DISHES.find(d=>d.id===id);
  $("#panel").innerHTML=`<div class="hero" ${bg(cur)}>${imgs[cur.id]?"":cur.e}<button class="close" id="x">✕</button></div>
  <div class="body"><h2>${cur.n}</h2><small style="color:var(--muted)">${cur.cat}</small>
  <p style="margin:10px 0">${cur.d}</p>
  <span class="price" style="font-size:20px">${fmt(cur.p)}</span> <small style="color:var(--muted)">${thb(cur.p)} (ລາຄາໂດຍປະມານ)</small>
  <button class="btn" id="gen">✨ ສ້າງຮູບງາມດ້ວຍ AI</button>
  <button class="btn alt" id="up">📷 ແປງຮູບອາຫານຂອງຂ້ອຍ</button>
  <p class="msg" id="msg"></p></div>`;
  $("#sheet").classList.add("show");
}
const closeSheet=()=>$("#sheet").classList.remove("show");
$("#sheet").onclick=e=>{if(e.target.id==="sheet"||e.target.id==="x")closeSheet()};

function shrink(b64){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=512,c=document.createElement("canvas");c.width=c.height=s;c.getContext("2d").drawImage(i,0,0,s,s);r(c.toDataURL("image/jpeg",.8))};i.src="data:image/png;base64,"+b64})}
const apiKey=()=>(load("lao_key","")||"").trim();
const NOKEY="ກະລຸນາໃສ່ API Key ໃນໜ້າຕັ້ງຄ່າກ່ອນ";
function busy(on,t){$("#gen").disabled=on;$("#up").disabled=on;$("#msg").textContent=t||""}
async function finish(j){
  if(j.error)throw new Error(j.error.message);
  imgs[cur.id]=await shrink(j.data[0].b64_json);
  if(!save("lao_imgs",imgs)){delete imgs[cur.id];throw new Error("ພື້ນທີ່ເກັບເຕັມ ລອງລ້າງຮູບໃນໜ້າຕັ້ງຄ່າ")}
  render();openDish(cur.id);$("#msg").textContent="ສຳເລັດແລ້ວ! ບັນທຶກຮູບໄວ້ໃນເຄື່ອງແລ້ວ";
}
$("#panel").onclick=async e=>{
  if(e.target.id==="x")return closeSheet();
  if(e.target.id==="up"){if(!apiKey())return $("#msg").textContent=NOKEY;$("#file").click();return}
  if(e.target.id!=="gen")return;
  if(!apiKey())return $("#msg").textContent=NOKEY;
  busy(true,"ກຳລັງສ້າງຮູບ ກະລຸນາລໍຖ້າ...");
  try{
    const r=await fetch("https://api.openai.com/v1/images/generations",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+apiKey()},
      body:JSON.stringify({model:"gpt-image-1",prompt:"Beautiful vibrant professional food photograph, warm natural light, colorful, top-down on a rustic table: "+cur.pr,size:"1024x1024",quality:"low",n:1})});
    await finish(await r.json());
  }catch(err){busy(false,"ຜິດພາດ: "+err.message)}
};
$("#file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f||!cur)return;
  busy(true,"ກຳລັງແປງຮູບໃຫ້ງາມ...");
  try{
    const fd=new FormData();fd.append("model","gpt-image-1");fd.append("image",f);fd.append("size","1024x1024");fd.append("quality","low");
    fd.append("prompt","Turn this into a beautiful, vibrant, professional photo of "+cur.pr+". Keep the dish, improve lighting, color and plating.");
    const r=await fetch("https://api.openai.com/v1/images/edits",{method:"POST",headers:{Authorization:"Bearer "+apiKey()},body:fd});
    await finish(await r.json());
  }catch(err){busy(false,"ຜິດພາດ: "+err.message)}
};
$("#key").value=load("lao_key","");
$("#saveKey").onclick=()=>{save("lao_key",$("#key").value.trim());$("#setMsg").textContent="ບັນທຶກແລ້ວ"};
$("#clearImgs").onclick=()=>{imgs={};save("lao_imgs",imgs);$("#setMsg").textContent="ລ້າງຮູບແລ້ວ"};
render();
</script>
